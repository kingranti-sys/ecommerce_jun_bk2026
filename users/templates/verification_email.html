<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
      font-family: Arial, sans-serif;
    "
  >
    <div
      style="
        max-width: 35rem;
        margin: 40px auto;
        background-color: #fff;
        padding: 40px;
        border-radius: 10px;
      "
    >
      <img
        src="https://cdn.create.vista.com/api/media/small/207138876/
        stock-photo-shop-now-isolated-premium-red-tag-sign-abstract-illustration"
        style="display: block; margin: 0 auto; width: 100px; height: 100px"
      />
      <h1 style="color: #222">Welcome to ShopNow</h1>

      <p style="color: #555; font-size: 1.1rem">Hello {{user.first_name}},</p>

      <p style="color: #555; font-size: 1.1rem; line-height: 1.6">
        Thank you for creating an account with ShopNow. Please use the
        verification code below to veify your email address
      </p>

      <div style="text-align: center; margin: 30px 0">
        <span
          style="
            display: inline-block;
            background-color: #111;
            color: #fff;
            padding: 15px 30px;
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 8px;
            border-radius: 8px;
          "
        >
          {{ otp }}</span
        >
      </div>

      <p style="color: #777; font-size: 14px; text-align: center">
        This verification code expires in 10 minutes
      </p>

      <p style="color: #555; font-size: 14px; line-height: 1.6">
        If you did not create this account, please ignore this mail
      </p>
    </div>
  </body>
</html>
